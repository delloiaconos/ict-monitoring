version: "3.8"

services:
  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer-agent
    restart: unless-stopped
    ports:
      - "9901:9001"   # Portainer Agent
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker/volumes:/var/lib/docker/volumes"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "9902:8080"   # cAdvisor metrics -> http://HOST:8080/metrics
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:rw"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"
    # If you want a different host port, change left side, e.g. "9095:8080"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "9903:9100"   # Node Exporter metrics -> http://HOST:9100/metrics
    volumes:
      - "/:/host:ro,rslave"
    command:
      - "--path.rootfs=/host"
      # Optional common ignores (uncomment if you see noisy mounts):
      # - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$"

  
# Tip (security): if Prometheus/Portainer are not on the same network, consider binding
# ports to localhost only, e.g. "127.0.0.1:8080:8080", and use a reverse proxy/VPN/firewall.
