global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: cadvisor
    static_configs:
      - targets: 
        - "cadvisor:8080"

  # node-exporter runs in host network mode -> scrape via localhost:9100 from Prometheus container
  # On Linux this is usually reachable as "host.docker.internal" only if you configure it;
  # easiest is to scrape the docker bridge IP of your host or run Prometheus in host network too.
  #
  # For a simple single-host setup, set a fixed host IP below (example: 192.168.1.10).
  - job_name: node-exporter
    static_configs:
      - targets: 
        - "node-exporter:9100"

  