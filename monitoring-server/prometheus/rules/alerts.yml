groups:
  - name: basics
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Target down (job={{ $labels.job }}, instance={{ $labels.instance }})"

      - alert: HostHighCPU
        expr: (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }} (>90% for 10m)"

      - alert: HostDiskFilling
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Disk nearly full on {{ $labels.instance }} (<10% free)"
