services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    restart: unless-stopped
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    expose:
      - "9093"
    restart: unless-stopped
    networks: [monitoring]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Important when behind a reverse proxy + subdomain:
      - GF_SERVER_DOMAIN=grafana.${BASE_DOMAIN}
      - GF_SERVER_ROOT_URL=https://grafana.${BASE_DOMAIN}/
    volumes:
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    restart: unless-stopped
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    restart: unless-stopped
    networks: [monitoring]

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: pve-exporter
    volumes:
      - ./pve/pve.yml:/etc/prometheus/pve.yml:ro
    expose:
      - "9221"
    restart: unless-stopped
    networks: [monitoring]

  pulse:
    image: rcourtman/pulse:latest   # consider pinning to a specific version tag later
    container_name: pulse
    restart: unless-stopped
    expose:
      - "7655"
    volumes:
      - pulse-data:/data
    environment:
      - TZ=Europe/Rome
      # Optional but recommended when behind a reverse proxy:
      - PULSE_PUBLIC_URL=http://pulse.${BASE_DOMAIN}
      # Optional: bootstrap admin (auto-hashed on startup)
      # - PULSE_AUTH_USER=admin
      # - PULSE_AUTH_PASS=change-me
    networks: [monitoring]

  homer:
    image: b4bz/homer:latest
    container_name: homer
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - INIT_ASSETS=1   # default is 1; seeds example config if none exists
    volumes:
      - ./homer/assets:/www/assets
    networks: [monitoring]

  nginx:
    image: nginx:alpine
    container_name: monitoring-nginx
    ports:
      - "80:80"
      # later, if you add TLS: "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # later, if you add TLS certs:
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - grafana
      - prometheus
      - alertmanager
      - pulse
      - homer 
    restart: unless-stopped
    networks: [monitoring]

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    expose:
      - "9000"   # Web UI (HTTP)
      - "9443"   # Web UI (HTTPS) - optional
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks: [monitoring]

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  pulse-data:
  portainer-data:
  
networks:
  monitoring:
    driver: bridge
